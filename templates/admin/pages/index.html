<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>海川运营台 · 数据概览</title>
  <style id="cd-tokens">:root{
  --brand:#0f766e; --brand-deep:#115e59; --accent:#f59e0b;
  --bg:#f4f6f8; --text:#1f2937; --muted:#6b7280; --card:#ffffff; --border:#e5e7eb;
  --fs-s:12px; --fs-m:14px; --fs-body:15px; --fs-h3:18px; --fs-h2:24px; --fs-h1:30px;
  --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-5:48px;
  --radius-s:6px; --radius:12px; --radius-l:18px;
}</style>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: var(--fs-body); }
    a { color: inherit; text-decoration: none; }
    .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
    .sidebar { background: #0b2b29; color: #cfe7e4; padding: var(--sp-3) var(--sp-2); display: flex; flex-direction: column; gap: 4px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: #fff; margin: 0 8px var(--sp-3); }
    .menu-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-s); font-size: var(--fs-m); }
    .menu-item:hover { background: rgba(255, 255, 255, .06); }
    .menu-item.active { background: var(--brand); color: #fff; }
    .main { padding: var(--sp-3) var(--sp-4); display: grid; gap: var(--sp-3); align-content: start; }
    .topbar { display: flex; align-items: center; justify-content: space-between; }
    .topbar h1 { font-size: var(--fs-h1); }
    .topbar p { color: var(--muted); font-size: var(--fs-m); }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: var(--radius-s); border: 1px solid var(--border); background: #fff; font: inherit; font-size: var(--fs-m); cursor: pointer; }
    .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-2); }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--sp-2) var(--sp-3); }
    .stat-card span { color: var(--muted); font-size: var(--fs-m); }
    .stat-card b { display: block; font-size: 28px; margin: 4px 0; }
    .trend { font-size: var(--fs-s); font-weight: 600; }
    .trend.up { color: #059669; }
    .trend.down { color: #dc2626; }
    .grid-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: var(--sp-2); }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--sp-3); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-2); }
    .panel-head h2 { font-size: var(--fs-h3); }
    .tabs { display: flex; gap: 4px; padding: 3px; background: #f1f3f5; border-radius: var(--radius-s); }
    .tabs button { border: 0; background: none; padding: 5px 12px; border-radius: 4px; font: inherit; font-size: var(--fs-s); cursor: pointer; color: var(--muted); }
    .tabs button.on { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
    .chart { width: 100%; height: 220px; }
    .chart .line { fill: none; stroke: var(--brand); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 900; animation: draw 1.6s ease forwards; }
    @keyframes draw { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
    .feed { list-style: none; display: grid; gap: 12px; }
    .feed li { display: flex; gap: 10px; font-size: var(--fs-m); }
    .feed .dot { width: 8px; height: 8px; margin-top: 7px; border-radius: 50%; background: var(--accent); flex: none; }
    .feed small { display: block; color: var(--muted); }
    dialog { border: 0; border-radius: var(--radius-l); padding: var(--sp-4); width: min(460px, 92vw); box-shadow: 0 30px 70px rgba(0, 0, 0, .3); }
    dialog::backdrop { background: rgba(15, 23, 42, .45); }
    dialog h3 { font-size: 20px; margin-bottom: var(--sp-2); }
    .field { display: grid; gap: 6px; margin-bottom: var(--sp-2); font-size: var(--fs-m); }
    .field input, .field select { padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-s); font: inherit; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: var(--sp-1); }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { flex-direction: row; overflow-x: auto; padding: var(--sp-1); }
      .brand { display: none; }
      .main { padding: var(--sp-2); }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#14b8a6"/><path d="M6 18c4-6 7-6 8-2s4 4 8-2" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
        海川运营台
      </div>
      <a class="menu-item active" href="index.html">数据概览</a>
      <a class="menu-item" href="orders.html">订单管理</a>
      <a class="menu-item" href="#settings" title="演示模板里没有这一页">系统设置</a>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1>早上好，陈经理</h1>
          <p>今天是 9 月 30 日，昨日共有 <strong>1,284</strong> 笔新订单。</p>
        </div>
        <button class="btn btn-primary" id="new-order">＋ 新建订单</button>
      </div>

      <div class="stats">
        <div class="stat-card"><span>今日营收</span><b>¥ 86,420</b><em class="trend up">↑ 12.4%</em></div>
        <div class="stat-card"><span>订单数</span><b>1,284</b><em class="trend up">↑ 8.1%</em></div>
        <div class="stat-card"><span>退款率</span><b>1.8%</b><em class="trend down">↑ 0.3%</em></div>
        <div class="stat-card"><span>新客户</span><b>312</b><em class="trend up">↑ 21%</em></div>
      </div>

      <div class="grid-2">
        <section class="panel">
          <div class="panel-head">
            <h2>营收趋势</h2>
            <div class="tabs" id="range-tabs">
              <button class="on">近 7 天</button>
              <button>近 30 天</button>
            </div>
          </div>
          <svg class="chart" viewBox="0 0 600 220" preserveAspectRatio="none">
            <g stroke="#eef0f3"><line x1="0" y1="55" x2="600" y2="55"/><line x1="0" y1="110" x2="600" y2="110"/><line x1="0" y1="165" x2="600" y2="165"/></g>
            <path class="line" d="M0 170 L100 140 L200 150 L300 96 L400 110 L500 60 L600 72"/>
          </svg>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>实时动态</h2><a href="orders.html" style="color: var(--brand); font-size: 13px;">全部订单 →</a></div>
          <ul class="feed" id="js-list"></ul>
        </section>
      </div>
    </main>
  </div>

  <dialog id="order-dialog">
    <h3>新建订单</h3>
    <form method="dialog">
      <label class="field">客户名称<input placeholder="例如：青禾书店"></label>
      <label class="field">商品
        <select>
          <option>年度会员</option>
          <option>季度会员</option>
        </select>
      </label>
      <div class="dialog-actions">
        <button class="btn" value="cancel">取消</button>
        <button class="btn btn-primary" value="ok">创建</button>
      </div>
    </form>
  </dialog>

  <script>
    var events = [
      { who: "青禾书店", what: "下单 年度会员 ×3", time: "2 分钟前" },
      { who: "岚山咖啡", what: "申请退款 ¥ 299", time: "11 分钟前" },
      { who: "星桥互娱", what: "续费 企业版", time: "35 分钟前" }
    ];
    var feed = document.getElementById("js-list");
    events.forEach(function (ev) {
      var li = document.createElement("li");
      li.innerHTML = '<i class="dot"></i><div>' + ev.who + " " + ev.what + "<small>" + ev.time + "</small></div>";
      feed.appendChild(li);
    });
    document.getElementById("new-order").addEventListener("click", function () {
      document.getElementById("order-dialog").showModal();
    });
    document.querySelectorAll("#range-tabs button").forEach(function (b) {
      b.addEventListener("click", function () {
        document.querySelectorAll("#range-tabs button").forEach(function (x) { x.classList.toggle("on", x === b); });
      });
    });
  </script>
</body>
</html>
