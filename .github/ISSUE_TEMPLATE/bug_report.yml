# CentDeck project automation.
name: Bug report
description: Report a reproducible problem in CentDeck.
title: "[Bug] "
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open a project…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Windows 11, Edge, Node.js 24"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Screenshots or error details
      description: Remove API keys and private project data before sharing.
