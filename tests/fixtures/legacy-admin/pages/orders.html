<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>海川运营台 · 订单管理</title>
  <style id="cd-tokens">:root{
  --brand:#0f766e; --brand-deep:#115e59; --accent:#f59e0b;
  --bg:#f4f6f8; --text:#1f2937; --muted:#6b7280; --card:#ffffff; --border:#e5e7eb;
  --fs-s:12px; --fs-m:14px; --fs-body:15px; --fs-h3:18px; --fs-h2:24px; --fs-h1:30px;
  --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-5:48px;
  --radius-s:6px; --radius:12px; --radius-l:18px;
}</style>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: var(--fs-body); }
    a { color: inherit; text-decoration: none; }
    .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
    .sidebar { background: #0b2b29; color: #cfe7e4; padding: var(--sp-3) var(--sp-2); display: flex; flex-direction: column; gap: 4px; }
    .brand { font-size: 18px; font-weight: 700; color: #fff; margin: 0 8px var(--sp-3); }
    .menu-item { padding: 10px 12px; border-radius: var(--radius-s); font-size: var(--fs-m); }
    .menu-item.active { background: var(--brand); color: #fff; }
    .main { padding: var(--sp-3) var(--sp-4); display: grid; gap: var(--sp-2); align-content: start; }
    .main h1 { font-size: var(--fs-h2); }
    .toolbar { display: flex; gap: var(--sp-1); align-items: center; flex-wrap: wrap; }
    .search { flex: 1; min-width: 200px; max-width: 320px; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-s); font: inherit; }
    .chip { padding: 7px 14px; border: 1px solid var(--border); border-radius: 99px; background: #fff; font: inherit; font-size: var(--fs-m); cursor: pointer; }
    .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
    .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: var(--fs-m); }
    th, td { padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: #f9fafb; color: var(--muted); font-weight: 600; }
    .status { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: var(--fs-s); }
    .status.paid { background: #dcfce7; color: #166534; }
    .status.pending { background: #fef3c7; color: #92400e; }
    .status.refund { background: #fee2e2; color: #991b1b; }
    .link-btn { border: 0; background: none; color: var(--brand); font: inherit; cursor: pointer; }
    .pager { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: var(--fs-m); }
    .modal { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(15, 23, 42, .45); }
    .modal[hidden] { display: none; }
    .modal-card { width: min(440px, 92vw); background: #fff; border-radius: var(--radius-l); padding: var(--sp-4); }
    .modal-card h3 { font-size: 20px; margin-bottom: var(--sp-2); }
    .detail { display: grid; grid-template-columns: 90px 1fr; gap: 8px 12px; font-size: var(--fs-m); }
    .detail dt { color: var(--muted); }
    .modal-actions { display: flex; justify-content: flex-end; margin-top: var(--sp-3); }
    .btn { padding: 9px 18px; border: 0; border-radius: var(--radius-s); background: var(--brand); color: #fff; font: inherit; cursor: pointer; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { flex-direction: row; padding: var(--sp-1); }
      .brand { display: none; }
      .main { padding: var(--sp-2); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">海川运营台</div>
      <a class="menu-item" href="index.html">数据概览</a>
      <a class="menu-item active" href="orders.html">订单管理</a>
    </aside>

    <main class="main">
      <h1>订单管理</h1>
      <div class="toolbar">
        <input class="search" id="kw" placeholder="搜索客户或订单号">
        <button class="chip on" data-filter="all">全部</button>
        <button class="chip" data-filter="paid">已支付</button>
        <button class="chip" data-filter="pending">待支付</button>
        <button class="chip" data-filter="refund">已退款</button>
      </div>

      <div class="table-wrap">
        <table id="orders">
          <tr><th>订单号</th><th>客户</th><th>商品</th><th>金额</th><th>状态</th><th>操作</th></tr>
          <tr data-status="paid"><td>HC-20260930-01</td><td>青禾书店</td><td>年度会员 ×3</td><td>¥ 2,697</td><td><span class="status paid">已支付</span></td><td><button class="link-btn" data-view>查看</button></td></tr>
          <tr data-status="pending"><td>HC-20260930-02</td><td>岚山咖啡</td><td>季度会员</td><td>¥ 299</td><td><span class="status pending">待支付</span></td><td><button class="link-btn" data-view>查看</button></td></tr>
          <tr data-status="refund"><td>HC-20260929-17</td><td>星桥互娱</td><td>企业版</td><td>¥ 19,800</td><td><span class="status refund">已退款</span></td><td><button class="link-btn" data-view>查看</button></td></tr>
          <tr data-status="paid"><td>HC-20260929-12</td><td>白鹭设计</td><td>年度会员</td><td>¥ 899</td><td><span class="status paid">已支付</span></td><td><button class="link-btn" data-view>查看</button></td></tr>
        </table>
      </div>

      <div class="pager"><span>共 4 条 · 第 1 / 1 页</span><a href="index.html" style="color: var(--brand);">← 返回数据概览</a></div>
    </main>
  </div>

  <div class="modal" id="detail-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <h3 id="detail-title">订单详情</h3>
      <dl class="detail" id="detail-body">
        <dt>订单号</dt><dd>—</dd>
      </dl>
      <div class="modal-actions"><button class="btn" data-close>知道了</button></div>
    </div>
  </div>

  <script>
    var modal = document.getElementById("detail-modal");
    document.querySelectorAll("[data-view]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var cells = btn.closest("tr").children;
        document.getElementById("detail-body").innerHTML =
          "<dt>订单号</dt><dd>" + cells[0].textContent + "</dd><dt>客户</dt><dd>" + cells[1].textContent +
          "</dd><dt>商品</dt><dd>" + cells[2].textContent + "</dd><dt>金额</dt><dd>" + cells[3].textContent + "</dd>";
        modal.hidden = false;
      });
    });
    modal.addEventListener("click", function (e) {
      if (e.target === modal || e.target.hasAttribute("data-close")) modal.hidden = true;
    });
    function applyFilter() {
      var active = document.querySelector(".chip.on").dataset.filter;
      var kw = document.getElementById("kw").value.trim();
      document.querySelectorAll("#orders tr[data-status]").forEach(function (tr) {
        var hit = (active === "all" || tr.dataset.status === active) && (!kw || tr.textContent.indexOf(kw) >= 0);
        tr.style.display = hit ? "" : "none";
      });
    }
    document.querySelectorAll(".chip").forEach(function (c) {
      c.addEventListener("click", function () {
        document.querySelectorAll(".chip").forEach(function (x) { x.classList.toggle("on", x === c); });
        applyFilter();
      });
    });
    document.getElementById("kw").addEventListener("input", applyFilter);
  </script>
</body>
</html>
